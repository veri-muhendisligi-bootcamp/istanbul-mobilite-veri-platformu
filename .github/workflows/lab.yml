name: Lab

# Bu iş akışı yalnızca lab/ci/calistir.sh betiğini çağırır; adımların tamamı lab/ci klasöründe durur.
#   veri-v* etiketi: İBB verisini hazırlar, sürüm eki olarak yayımlar, ardından ortamı sınar.
#   imaj-v* etiketi: lab imajını derleyip yayımlar, ardından ortamı sınar.
#   test-v* etiketi ya da lab dosyalarına dokunan gönderim: ortamı sınar.
on:
  push:
    branches: [main]
    tags: ["veri-v*", "imaj-v*", "test-v*"]
  workflow_dispatch:
    inputs:
      is:
        description: "veri, imaj ya da test"
        required: true
        default: test

permissions:
  contents: write
  packages: write

concurrency:
  group: lab
  cancel-in-progress: false

jobs:
  calistir:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Lab işi
        run: bash lab/ci/calistir.sh
        env:
          GH_TOKEN: ${{ github.token }}
          KUSUR_TOHUMU: ${{ secrets.KUSUR_TOHUMU }}
          IS: ${{ inputs.is }}
          OLAY: ${{ github.event_name }}
          ETIKET: ${{ github.ref_name }}
          REF_TURU: ${{ github.ref_type }}
          ONCEKI: ${{ github.event.before }}
          DEPO: ${{ github.repository }}
          AKTOR: ${{ github.actor }}
          GIZLI_DEPO: ${{ github.event.repository.private }}
